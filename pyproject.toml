[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikharness"
version = "0.1.0"
description = "Objective evaluation harness for XR avatar inverse kinematics"
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
ikh = "ikharness.ikh:main"

[project.optional-dependencies]
openxr = ["pyopenxr>=1.1"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
